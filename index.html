<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ネオン居酒屋 酔い度チェック</title>
    <style>
        /* 基本設定：暗めの背景と中央寄せレイアウト */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d12; /* 深い暗色 */
            color: #fff;
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto; /* ボタンが増えた場合のためにスクロールを許可 */
        }

        /* アプリケーションのコンテナ */
        .app-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* ネオンサイン風のテキストスタイル */
        .neon-title {
            color: #fff;
            text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #e60073,
                0 0 40px #e60073,
                0 0 80px #e60073;
            font-size: 2.2rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .neon-cyan {
            text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #00ffff,
                0 0 40px #00ffff;
        }

        /* 質問表示エリアの装飾 */
        .question-box {
            background: rgba(20, 20, 30, 0.8);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 30px 20px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 0 15px rgba(0, 255, 255, 0.1);
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 1.3rem;
            line-height: 1.6;
            font-weight: bold;
        }

        /* 光るボタンのスタイル */
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin-bottom: 15px;
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px #00ffff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.5), inset 0 0 8px rgba(0, 255, 255, 0.3);
            font-weight: bold;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ボタンのホバー・タップ時のエフェクト */
        .btn:hover, .btn:active {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 20px #00ffff, inset 0 0 10px #00ffff;
            text-shadow: none;
        }

        /* ピンクバージョンのボタン（強調用） */
        .btn-pink {
            color: #ff00ff;
            border-color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
            box-shadow: 0 0 8px rgba(255, 0, 255, 0.5), inset 0 0 8px rgba(255, 0, 255, 0.3);
        }

        .btn-pink:hover, .btn-pink:active {
            background: #ff00ff;
            color: #fff;
            box-shadow: 0 0 20px #ff00ff, inset 0 0 10px #ff00ff;
            text-shadow: none;
        }

        /* 画面のフェードアニメーション用 */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .screen.active {
            display: block;
            opacity: 1;
        }

        /* 結果表示画面のスタイル */
        .result-title {
            font-size: 2.8rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .result-comment {
            font-size: 1.3rem;
            margin-bottom: 35px;
            line-height: 1.6;
            padding: 0 10px;
        }

        .score-display {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #aaa;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- スタート画面 -->
    <div id="start-screen" class="screen active">
        <h1 class="neon-title">酔い度チェック</h1>
        <p style="margin-bottom: 40px; color: #ccc; line-height: 1.8;">
            居酒屋のネオンの下で<br>
            あなたの酔っ払い度を微積で判定します！<br>
            酔っていても解けるかな？🍻
        </p>
        <button class="btn btn-pink" onclick="startQuiz()">診断スタート！</button>
    </div>

    <!-- 問題出題画面 -->
    <div id="quiz-screen" class="screen">
        <h2 class="neon-title neon-cyan" style="font-size: 1.6rem;" id="q-counter">第1問</h2>
        <div class="question-box">
            <div id="question-text" class="question-text">ここに問題が入ります</div>
        </div>
        <div id="choices-container">
            <!-- JavaScriptでボタンが自動生成されます -->
        </div>
    </div>

    <!-- 診断結果画面 -->
    <div id="result-screen" class="screen">
        <h2 class="neon-title neon-cyan" style="font-size: 1.5rem; margin-bottom: 10px;">診断結果</h2>
        <div class="score-display">合計スコア: <span id="final-score">0</span> 点</div>
        
        <!-- 結果のテキスト（JSで書き換えます） -->
        <div id="result-title" class="result-title">ほぼ素面です</div>
        <div id="result-comment" class="result-comment">まだまだ飲めますね！</div>
        
        <button class="btn btn-pink" onclick="resetQuiz()" style="margin-top: 10px;">もう一回診断する🔄</button>
    </div>

</div>

<script>
    // --- 1. 問題データの定義 ---
    const questions = [
        {
            text: "第1問（微分）<br><br>f(x) = x<sup>2</sup> の導関数 f'(x) は？",
            choices: [
                { text: "2x", score: 0 },
                { text: "x", score: 1 },
                { text: "2", score: 1 },
                { text: "0", score: 2 }
            ]
        },
        {
            text: "第2問（定積分）<br><br>∫<sub>0</sub><sup>1</sup> 2x dx の値は？",
            choices: [
                { text: "1", score: 0 },
                { text: "2", score: 1 },
                { text: "0", score: 1 },
                { text: "1/2", score: 2 }
            ]
        },
        {
            text: "第3問（微分）<br><br>f(x) = sin(x) の導関数 f'(x) は？",
            choices: [
                { text: "cos(x)", score: 0 },
                { text: "-cos(x)", score: 1 },
                { text: "sin(x)", score: 1 },
                { text: "-sin(x)", score: 2 }
            ]
        },
        {
            text: "第4問（定積分）<br><br>∫<sub>0</sub><sup>π/2</sup> cos(x) dx の値は？",
            choices: [
                { text: "1", score: 0 },
                { text: "0", score: 1 },
                { text: "-1", score: 1 },
                { text: "π", score: 2 }
            ]
        },
        {
            text: "第5問（微分）<br><br>f(x) = e<sup>x</sup> の導関数 f'(x) は？",
            choices: [
                { text: "e<sup>x</sup>", score: 0 },
                { text: "x e<sup>x-1</sup>", score: 1 },
                { text: "ln(x)", score: 2 },
                { text: "1", score: 2 }
            ]
        },
        {
            text: "第6問（定積分）<br><br>∫<sub>1</sub><sup>2</sup> 3x<sup>2</sup> dx の値は？",
            choices: [
                { text: "7", score: 0 },
                { text: "8", score: 1 },
                { text: "6", score: 1 },
                { text: "3", score: 2 }
            ]
        },
        {
            text: "第7問（微分）<br><br>f(x) = ln(x) の導関数 f'(x) は？ (x > 0)",
            choices: [
                { text: "1 / x", score: 0 },
                { text: "e<sup>x</sup>", score: 1 },
                { text: "1", score: 1 },
                { text: "x", score: 2 }
            ]
        },
        {
            text: "第8問（定積分）<br><br>∫<sub>0</sub><sup>1</sup> e<sup>x</sup> dx の値は？",
            choices: [
                { text: "e - 1", score: 0 },
                { text: "e", score: 1 },
                { text: "1", score: 2 },
                { text: "e + 1", score: 2 }
            ]
        },
        {
            text: "第9問（微分）<br><br>f(x) = x<sup>3</sup> - 3x + 2 の導関数 f'(x) は？",
            choices: [
                { text: "3x<sup>2</sup> - 3", score: 0 },
                { text: "3x - 3", score: 1 },
                { text: "3x<sup>2</sup>", score: 1 },
                { text: "x<sup>2</sup> - 3", score: 2 }
            ]
        },
        {
            text: "第10問（定積分）<br><br>∫<sub>-1</sub><sup>1</sup> x<sup>3</sup> dx の値は？",
            choices: [
                { text: "0", score: 0 },
                { text: "1", score: 1 },
                { text: "1/2", score: 1 },
                { text: "2", score: 2 }
            ]
        }
    ];

    // --- 2. 状態管理の変数 ---
    let currentQuestionIndex = 0; // 現在の問題番号 (0始まり)
    let totalScore = 0;           // 合計点

    // --- 3. 画面の切り替え関数（フェードアニメーション付き） ---
    function showScreen(screenId) {
        const screens = document.querySelectorAll('.screen');
        
        // 全ての画面を非表示・透明にする
        screens.forEach(screen => {
            screen.classList.remove('active');
            setTimeout(() => {
                if(!screen.classList.contains('active')) {
                    screen.style.display = 'none';
                }
            }, 400); // CSSのtransition時間(0.4s)に合わせる
        });

        // 対象の画面を表示・フェードインする
        const targetScreen = document.getElementById(screenId);
        setTimeout(() => {
            targetScreen.style.display = 'block';
            // display: block が適用された直後に opacity を上げる
            setTimeout(() => {
                targetScreen.classList.add('active');
            }, 50);
        }, 400);
    }

    // --- 4. 診断スタート処理 ---
    function startQuiz() {
        currentQuestionIndex = 0;
        totalScore = 0;
        renderQuestion();
        showScreen('quiz-screen');
    }

    // --- 5. 問題の表示処理 ---
    function renderQuestion() {
        const q = questions[currentQuestionIndex];
        
        // 問題番号と問題文のセット
        document.getElementById('q-counter').innerHTML = `第 ${currentQuestionIndex + 1} 問`;
        document.getElementById('question-text').innerHTML = q.text;

        // 選択肢ボタンの生成
        const choicesContainer = document.getElementById('choices-container');
        choicesContainer.innerHTML = ''; // 以前のボタンをクリア

        q.choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerHTML = choice.text;
            // ボタンがクリックされたら点数を加算して次へ
            btn.onclick = () => selectAnswer(choice.score);
            choicesContainer.appendChild(btn);
        });
    }

    // --- 6. 回答を選択した時の処理 ---
    function selectAnswer(score) {
        totalScore += score; // 点数を加算
        currentQuestionIndex++; // 次の問題へ

        const quizScreen = document.getElementById('quiz-screen');
        
        // 最後の問題でなければ次の問題を表示（軽いフェード演出付き）
        if (currentQuestionIndex < questions.length) {
            quizScreen.classList.remove('active');
            setTimeout(() => {
                renderQuestion();
                quizScreen.classList.add('active');
            }, 300); // 0.3秒間暗くして次の問題へ
        } else {
            // 全問終わったら結果画面へ
            showResult();
        }
    }

    // --- 7. 結果表示処理 ---
    function showResult() {
        document.getElementById('final-score').innerText = totalScore;
        const titleEl = document.getElementById('result-title');
        const commentEl = document.getElementById('result-comment');

        // 点数に応じて結果を分岐 (10問、最大20点)
        if (totalScore <= 3) {
            titleEl.innerText = "ほぼ素面です";
            titleEl.style.color = "#00ffff"; // シアン
            titleEl.style.textShadow = "0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff";
            commentEl.innerHTML = "シラフで微積ができる！✨<br>まだまだ飲めますね！";
        } else if (totalScore <= 10) {
            titleEl.innerText = "ほんのり酔ってます";
            titleEl.style.color = "#ffff00"; // イエロー
            titleEl.style.textShadow = "0 0 10px #ffff00, 0 0 20px #ffff00, 0 0 40px #ffff00";
            commentEl.innerHTML = "計算ミスが増えてきましたね🍻<br>そろそろお水を挟むと良いかも！";
        } else {
            titleEl.innerText = "かなり酔ってます";
            titleEl.style.color = "#ff0055"; // レッド/ピンク
            titleEl.style.textShadow = "0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0055";
            commentEl.innerHTML = "⚠️ 水飲んでください！！！ ⚠️<br>数式が宇宙語に見えてませんか？<br>無事に帰りましょう！";
        }

        showScreen('result-screen');
    }

    // --- 8. 最初からやり直す処理 ---
    function resetQuiz() {
        showScreen('start-screen');
    }
</script>

</body>
</html>
