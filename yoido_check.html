<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ネオン居酒屋 酔い度チェック</title>
    <style>
        /* 基本設定：暗めの背景と中央寄せレイアウト */
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* フェード時のスクロール防止 */
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* ネオンサイン風のタイトル */
        h1 {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 
                0 0 5px #ff2e93, 
                0 0 10px #ff2e93, 
                0 0 20px #ff2e93, 
                0 0 40px #ff2e93;
            margin-bottom: 20px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        /* 質問テキスト */
        .question-text {
            font-size: 1.3rem;
            margin-bottom: 30px;
            min-height: 100px;
            line-height: 1.6;
        }

        /* ネオンボタンのスタイル */
        .neon-btn {
            background: transparent;
            color: #08f7fe;
            border: 2px solid #08f7fe;
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            display: block;
            width: 100%;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 5px #08f7fe, 
                inset 0 0 5px #08f7fe;
            text-shadow: 0 0 2px #08f7fe;
        }

        .neon-btn:hover, .neon-btn:active {
            background: #08f7fe;
            color: #1a1a2e;
            box-shadow: 
                0 0 20px #08f7fe, 
                inset 0 0 10px #08f7fe;
        }

        /* アクセントカラー用のボタン（スタート画面、結果画面など） */
        .btn-accent {
            color: #ff2e93;
            border-color: #ff2e93;
            box-shadow: 0 0 5px #ff2e93, inset 0 0 5px #ff2e93;
            text-shadow: 0 0 2px #ff2e93;
            margin-top: 20px;
        }
        .btn-accent:hover, .btn-accent:active {
            background: #ff2e93;
            color: #fff;
            box-shadow: 0 0 20px #ff2e93, inset 0 0 10px #ff2e93;
        }

        /* アニメーション用クラス */
        .fade-out {
            animation: fadeOut 0.4s forwards;
        }
        .fade-in {
            animation: fadeIn 0.4s forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 診断結果画面のスタイル */
        .result-title {
            font-size: 2.2rem;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .result-comment {
            font-size: 1.2rem;
            margin-bottom: 40px;
            line-height: 1.6;
            color: #ddd;
        }

        /* 画面切り替え用の非表示クラス */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- スタート画面 -->
        <div id="start-screen" class="fade-in">
            <h1>酔い度チェック</h1>
            <p style="margin-bottom: 40px; color: #aaa; font-size: 1.1rem;">あなたの今の「酔い度」を<br>サクッと判定します！🍻</p>
            <button class="neon-btn btn-accent" onclick="startQuiz()">診断スタート！</button>
        </div>

        <!-- クイズ画面 -->
        <div id="quiz-screen" class="hidden">
            <h2 id="quiz-title" style="font-size: 1.4rem; color: #08f7fe; text-shadow: 0 0 10px #08f7fe; margin-bottom: 20px;">第1問</h2>
            <div id="question-text" class="question-text">ここに問題が表示されます</div>
            <div id="choices-container">
                <!-- ボタンがJavaScriptで生成されます -->
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="hidden">
            <h2 style="color: #fff; font-size: 1.2rem; margin-bottom: 10px;">診断結果</h2>
            <div id="result-title" class="result-title">ここに結果</div>
            <div id="result-comment" class="result-comment">ここにコメント</div>
            <button class="neon-btn btn-accent" onclick="resetQuiz()">もう一回診断する</button>
        </div>
    </div>

    <script>
        // --- データ定義 ---
        const questions = [
            {
                text: "簡単な計算問題です。<br><br>1000円出して、300円のビールと400円の枝豆を買いました。<br>お釣りはいくら？",
                choices: [
                    { text: "300円", score: 0 }, // 正解
                    { text: "200円", score: 1 }, // 少し怪しい（計算ミス）
                    { text: "お釣りはいらねぇ！", score: 2 } // 明らかにおかしい
                ]
            },
            {
                text: "次の文字の『色』を答えてください。<br><br><span style='color:#ff2e93; font-size:3rem; font-weight:bold; display:block; margin-top:10px;'>青</span>",
                choices: [
                    { text: "ピンク（赤系）", score: 0 }, // 正解
                    { text: "青", score: 1 }, // 少し怪しい（文字の意味に釣られている）
                    { text: "黄色", score: 2 } // 明らかにおかしい
                ]
            },
            {
                text: "右手を上げて、左目を閉じてください。<br>……そのまま答えてください。<br><br>さて、今何問目ですか？",
                choices: [
                    { text: "3問目", score: 0 }, // 正解
                    { text: "2問目", score: 1 }, // 少し怪しい（記憶が曖昧）
                    { text: "もう帰りたい", score: 2 } // 明らかにおかしい（限界）
                ]
            }
        ];

        // --- 状態管理 ---
        let currentQuestionIndex = 0;
        let totalScore = 0;

        // --- DOM要素の取得 ---
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const quizTitle = document.getElementById('quiz-title');
        const questionText = document.getElementById('question-text');
        const choicesContainer = document.getElementById('choices-container');
        
        const resultTitle = document.getElementById('result-title');
        const resultComment = document.getElementById('result-comment');

        // --- 関数 ---

        // 画面の切り替え（フェードアニメーション付き）
        function switchScreen(hideElement, showElement) {
            hideElement.classList.remove('fade-in');
            hideElement.classList.add('fade-out');
            
            setTimeout(() => {
                hideElement.classList.add('hidden');
                showElement.classList.remove('hidden', 'fade-out');
                showElement.classList.add('fade-in');
            }, 400); // CSSのanimation時間(0.4s)に合わせる
        }

        // クイズ開始
        function startQuiz() {
            currentQuestionIndex = 0;
            totalScore = 0;
            displayQuestion();
            switchScreen(startScreen, quizScreen);
        }

        // 問題の表示
        function displayQuestion() {
            const q = questions[currentQuestionIndex];
            
            // 問題タイトルとテキストの更新
            quizTitle.textContent = `第 ${currentQuestionIndex + 1} 問`;
            questionText.innerHTML = q.text; 
            
            // 選択肢ボタンの生成
            choicesContainer.innerHTML = '';
            
            // アニメーションのために一度非表示にしてからフェードイン
            quizScreen.classList.remove('fade-in', 'fade-out');
            void quizScreen.offsetWidth; // リフローを強制してアニメーションを再トリガー
            quizScreen.classList.add('fade-in');

            q.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'neon-btn';
                btn.innerHTML = choice.text;
                btn.onclick = () => handleAnswer(choice.score);
                choicesContainer.appendChild(btn);
            });
        }

        // 回答時の処理
        function handleAnswer(score) {
            totalScore += score;
            currentQuestionIndex++;

            // フェードアウト効果
            quizScreen.classList.remove('fade-in');
            quizScreen.classList.add('fade-out');

            setTimeout(() => {
                if (currentQuestionIndex < questions.length) {
                    // 次の問題へ
                    displayQuestion();
                } else {
                    // 全問終了、結果表示へ
                    showResult();
                }
            }, 400);
        }

        // 結果の表示
        function showResult() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden', 'fade-out');
            resultScreen.classList.add('fade-in');

            let title = "";
            let comment = "";

            // 点数に応じた結果判定とスタイリング
            if (totalScore <= 1) {
                title = "ほぼ素面です🍺";
                comment = "まだまだいけますね！<br>冷静な判断力が保たれています。";
                resultTitle.style.color = "#08f7fe";
                resultTitle.style.textShadow = "0 0 10px #08f7fe, 0 0 20px #08f7fe";
            } else if (totalScore <= 3) {
                title = "ほんのり酔ってます🥂";
                comment = "いい感じに楽しくなってきている頃合いですね。<br>足元には気をつけて！";
                resultTitle.style.color = "#f5d300"; // ネオンイエロー
                resultTitle.style.textShadow = "0 0 10px #f5d300, 0 0 20px #f5d300";
            } else {
                title = "かなり酔ってます🍷";
                comment = "水飲んでください！！！🚰<br>今日はもうお酒ストップでお願いします🙇‍♂️";
                resultTitle.style.color = "#ff2e93"; // ネオンピンク
                resultTitle.style.textShadow = "0 0 10px #ff2e93, 0 0 20px #ff2e93, 0 0 40px #ff2e93";
            }

            resultTitle.innerHTML = title;
            resultComment.innerHTML = comment;
        }

        // クイズをリセット
        function resetQuiz() {
            switchScreen(resultScreen, startScreen);
        }
    </script>
</body>
</html>
